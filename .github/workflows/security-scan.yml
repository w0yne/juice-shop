name: Claude Code Security Review

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # Job 1: Auto security review on every PR
  security-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - name: Claude Code Security Review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          show_full_output: "true"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            你是一名资深应用安全工程师，正在对这个 Pull Request 中变更的代码进行安全审计。
            PR 分支已经 checkout 到当前目录。

            ## 步骤

            1. 运行 `gh pr diff ${{ github.event.pull_request.number }}` 查看变更的代码
            2. 逐文件分析安全漏洞
            3. 使用 `mcp__github_inline_comment__create_inline_comment`（设置 `confirmed: true`）在代码对应行上发布 inline review comment
            4. 使用 `gh pr comment` 发布总结评论

            只通过 GitHub 评论发布结果——不要仅输出文本。

            ## 漏洞检查清单

            ### 严重 (Critical)
            - SQL 注入：字符串拼接查询
            - 远程代码执行：eval()、new Function()、child_process.exec()、vm.runInContext()
            - 认证绕过：缺失认证中间件、JWT 弱点、硬编码密钥
            - XXE：不安全的 XML 解析

            ### 高危 (High)
            - XSS：用户输入未转义嵌入 HTML
            - 命令注入：用户输入流入 shell 命令
            - NoSQL 注入：$where 中拼接用户输入
            - SSRF / IDOR / 路径遍历

            ### 中危 (Medium)
            - 敏感数据泄露：密码明文日志、硬编码凭据
            - 弱加密：MD5/SHA1 存储密码

            ### 低危 (Low)
            - 信息泄露、缺失速率限制

            ## Inline Comment 格式

            每个漏洞的 inline comment 包含：
            - 严重程度 emoji（🔴严重/🟠高危/🟡中危/🟢低危）+ CWE 编号 + 标题
            - 描述（3-5句详细分析）
            - 攻击方式（含示例 payload）
            - 修复建议（含修复代码示例）

            ## 总结评论

            用 `gh pr comment` 发一条总结，包含：
            - 漏洞统计表格（按严重程度分类）
            - 每个漏洞的一行摘要
            - 整体安全评估

            ## 规则
            - 所有输出使用中文
            - 只报告有把握的问题
            - 每个发现必须包含修复代码
          claude_args: |
            --model global.anthropic.claude-opus-4-6-v1
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(cat:*),Bash(head:*),Bash(grep:*),Bash(find:*),Bash(wc:*)"

  # Job 2: Respond to @claude mentions in comments
  claude-respond:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - name: Claude Code Respond
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          trigger_phrase: "@claude"
          claude_args: '--model global.anthropic.claude-opus-4-6-v1 --max-turns 20'
