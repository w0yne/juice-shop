name: Claude Code Security Review

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # Job 1: Auto security review on every PR
  security-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - name: Claude Code Security Review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          show_full_output: "true"
          prompt: |
            你是一名资深应用安全工程师。你的任务是审计这个 PR 的代码变更并将结果发布到 PR 上。

            ## 重要：你必须使用 gh CLI 发布评论

            你的分析结果必须通过执行 `gh pr comment` 命令发布到 PR 上。
            仅仅输出文本是不够的——没有人会看到你的文本输出。
            你必须运行 bash 命令来发布评论。

            ## 步骤

            ### 第一步：获取代码变更
            ```bash
            git diff origin/master...HEAD -- routes/ lib/ models/ server.ts
            ```

            ### 第二步：分析每个变更文件的安全漏洞

            检查以下类型的漏洞：
            - SQL 注入、NoSQL 注入
            - 远程代码执行（eval、new Function、child_process.exec）
            - 跨站脚本 XSS
            - 命令注入
            - 敏感数据泄露（密码明文日志）
            - 路径遍历、SSRF、IDOR

            ### 第三步：使用 gh CLI 发布评论（必须执行！）

            将你的分析结果写入文件，然后用 gh 发布：

            ```bash
            cat > /tmp/security-review.md << 'REVIEW_EOF'
            ## 🔒 Claude Code 安全审计报告

            （这里写你的完整分析报告，包含每个漏洞的详细描述、攻击方式、修复建议）

            REVIEW_EOF

            gh pr comment $PR_NUMBER --body-file /tmp/security-review.md
            ```

            **你必须执行 `gh pr comment` 命令！这是最关键的一步。如果你不执行这个命令，你的分析将不会被任何人看到。**

            ### 漏洞报告格式（每个漏洞）

            #### 🔴 严重 | CWE-XXX | 漏洞标题
            - **文件：** `路径` 第 X 行
            - **漏洞代码：** （代码片段）
            - **描述：** （3-5句详细分析）
            - **攻击方式：** （示例 payload）
            - **修复建议：** （修复后的代码）

            ## 规则
            - 所有输出使用中文
            - 只报告有把握的问题
            - 每个发现必须包含修复代码
            - **最后必须执行 gh pr comment 命令发布报告**
          claude_args: '--model global.anthropic.claude-opus-4-6-v1 --max-turns 20'

  # Job 2: Respond to @claude mentions in comments
  claude-respond:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - name: Claude Code Respond
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          trigger_phrase: "@claude"
          claude_args: '--model global.anthropic.claude-opus-4-6-v1 --max-turns 20'
