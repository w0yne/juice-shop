name: Claude Code Security Review

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # Job 1: Auto security review on every PR
  security-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - name: Claude Code Security Review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          show_full_output: "true"
          prompt: |
            你是一名资深应用安全工程师，正在对这个 Pull Request 中变更的代码进行安全审计。

            ## 任务

            1. 运行 `git diff origin/master...HEAD -- routes/ lib/ models/ server.ts` 查看变更的代码
            2. 逐文件分析安全漏洞
            3. 使用 `gh` CLI 在 PR 上发表 review comment

            ## 发表评论的方式

            分析完所有漏洞后，使用以下命令发表 PR review：

            ```bash
            gh api repos/{owner}/{repo}/pulls/{pr_number}/reviews \
              --method POST \
              -f body="总结评论内容" \
              -f event="COMMENT" \
              -f 'comments[][path]=文件路径' \
              -f 'comments[][position]=diff中的行位置' \
              -f 'comments[][body]=评论内容'
            ```

            或者更简单地，用 `gh pr comment` 发总结评论，用 `gh pr review` 发 inline 评论：

            ```bash
            # 发总结评论
            gh pr comment $PR_NUMBER --body "评论内容"

            # 发 review（带 inline comments）
            gh pr review $PR_NUMBER --comment --body "总结"
            ```

            环境变量 `$PR_NUMBER`、`$REPO_OWNER`、`$REPO_NAME` 已经设置好了。

            ## 漏洞检查清单

            ### 严重 (Critical)
            - **SQL 注入**：原始查询、查询中的字符串拼接、未过滤的 req.query/req.params 用于 SQL
            - **远程代码执行 (RCE)**：用户输入进入 eval()、new Function()、child_process.exec()、vm.runInContext()
            - **认证绕过**：缺失认证中间件、JWT 弱点、硬编码密钥

            ### 高危 (High)
            - **跨站脚本 (XSS)**：用户输入未转义直接嵌入 HTML
            - **命令注入**：用户输入流入 shell 命令
            - **NoSQL 注入**：$where 子句中拼接用户输入
            - **SSRF / IDOR / 路径遍历**

            ### 中危 (Medium)
            - **敏感数据泄露**：密码明文写入日志、硬编码凭据
            - **弱加密**：MD5/SHA1 存储密码

            ### 低危 (Low)
            - **信息泄露**、**缺失速率限制**

            ## 每个漏洞的评论格式

            ### [🔴严重/🟠高危/🟡中危/🟢低危] [CWE-编号] 漏洞标题

            **文件：** `文件路径` 第 X 行

            **漏洞代码：**
            ```
            有问题的代码
            ```

            **描述：** 详细说明漏洞形成原因和影响范围（3-5句话）

            **攻击方式：** 包含示例 payload

            **修复建议：**
            ```typescript
            // 修复后的代码
            ```

            > OWASP: 分类 | 置信度: HIGH/MEDIUM/LOW

            ## 最终步骤

            分析完所有文件后，必须执行以下操作：
            1. 用 `gh pr comment $PR_NUMBER --body "..."` 发一条包含所有漏洞详情的总结评论
            2. 所有输出使用中文
          claude_args: '--model global.anthropic.claude-opus-4-6-v1 --max-turns 20'

  # Job 2: Respond to @claude mentions in comments
  claude-respond:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - name: Claude Code Respond
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          trigger_phrase: "@claude"
          claude_args: '--model global.anthropic.claude-opus-4-6-v1 --max-turns 20'
