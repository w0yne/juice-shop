name: Claude Code Security Review

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # Job 1: Auto security review on every PR
  security-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - name: Claude Code Security Review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          show_full_output: "true"
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(git diff*)",
                  "Bash(git log*)",
                  "Bash(git show*)",
                  "Bash(cat *)",
                  "Bash(head *)",
                  "Bash(grep *)",
                  "Bash(find *)",
                  "Bash(wc *)",
                  "Bash(ls *)",
                  "Bash(echo *)",
                  "Read",
                  "Grep",
                  "Glob",
                  "mcp__github_comment__create_comment",
                  "mcp__github_comment__update_comment",
                  "mcp__github_inline_comment__create_inline_comment",
                  "mcp__github_inline_comment__create_inline_comments",
                  "mcp__github_inline_comment__get_pr_diff"
                ]
              }
            }
          prompt: |
            你是一名资深应用安全工程师。你的任务是审计这个 PR 的代码变更并将结果发布到 PR 上。

            ## 步骤

            ### 第一步：获取代码变更
            运行 `git diff origin/master...HEAD -- routes/ lib/ models/ server.ts` 查看变更的代码。

            ### 第二步：分析漏洞
            检查以下类型：SQL 注入、远程代码执行（eval/new Function/child_process.exec）、XSS、命令注入、敏感数据泄露（密码明文日志）、NoSQL 注入、路径遍历、SSRF、IDOR。

            ### 第三步：使用 create_inline_comments 工具发布 inline review
            对每个漏洞，使用 `create_inline_comments` 工具在代码对应行上发布 review comment。先用 `get_pr_diff` 获取 diff 来确定正确的行号。

            ### 第四步：使用 create_comment 工具发布总结
            发一条总结评论，包含漏洞统计表格和整体安全评估。

            ## 每个漏洞的评论格式
            ### 🔴严重/🟠高危/🟡中危/🟢低危 | CWE-XXX | 标题
            - **描述：** 3-5句详细分析
            - **攻击方式：** 示例 payload
            - **修复建议：** 修复后的代码

            ## 规则
            - 所有输出使用中文
            - 只报告有把握的问题
            - 每个发现必须包含修复代码
            - **必须使用工具发布评论，不要只输出文本**
          claude_args: '--model global.anthropic.claude-opus-4-6-v1 --max-turns 20 --permission-mode bypassPermissions --allowedTools "mcp__github_comment__create_comment,mcp__github_comment__update_comment,mcp__github_inline_comment__create_inline_comments,mcp__github_inline_comment__create_inline_comment,mcp__github_inline_comment__get_pr_diff"'

  # Job 2: Respond to @claude mentions in comments
  claude-respond:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - name: Claude Code Respond
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          trigger_phrase: "@claude"
          claude_args: '--model global.anthropic.claude-opus-4-6-v1 --max-turns 20'
