name: Claude Code Security Review

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # Job 1: Auto security review on every PR
  security-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Claude Code Security Review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          prompt: |
            你是一名资深应用安全工程师，正在对这个 Pull Request 中变更的代码进行安全审计。

            ## 任务

            1. 仔细阅读本次 PR 的所有代码变更（diff）
            2. 针对变更的代码，逐文件分析安全漏洞
            3. 对每个发现的漏洞，直接在对应的代码行上添加 review comment

            ## 漏洞检查清单

            ### 严重 (Critical)
            - **SQL 注入**：原始查询、查询中的字符串拼接、未过滤的 req.query/req.params 用于 SQL
            - **远程代码执行 (RCE)**：用户输入进入 eval()、new Function()、child_process.exec()、vm.runInContext()、不安全的反序列化
            - **认证绕过**：缺失认证中间件、JWT 弱点、硬编码密钥
            - **XML 外部实体 (XXE)**：不安全的 XML 解析（noent: true）

            ### 高危 (High)
            - **跨站脚本 (XSS)**：反射型/存储型/DOM XSS、用户输入未转义直接嵌入 HTML
            - **路径遍历**：用户输入在文件路径中、../未过滤
            - **命令注入**：用户输入流入 shell 命令（child_process.exec 拼接用户输入）
            - **不安全的直接对象引用 (IDOR)**：缺失资源所有权检查
            - **服务端请求伪造 (SSRF)**：用户控制的 URL 用于服务端请求
            - **NoSQL 注入**：$where 子句中拼接用户输入

            ### 中危 (Medium)
            - **敏感数据泄露**：密码明文写入日志、硬编码凭据/密钥
            - **不安全配置**：宽松的 CORS、缺失安全头
            - **访问控制失效**：缺失角色检查
            - **弱加密**：MD5/SHA1 存储密码

            ### 低危 (Low)
            - **信息泄露**：堆栈跟踪、版本信息暴露
            - **缺失速率限制**：认证端点无暴力破解保护

            ## Review Comment 格式

            对每个漏洞，在对应代码行上的 review comment 必须包含以下内容：

            ### [严重程度] [CWE-编号] 漏洞标题

            **漏洞代码：**
            ```
            （引用有问题的代码片段）
            ```

            **描述：** 详细说明漏洞是什么、形成原因、影响范围。至少3-5句话。

            **攻击方式：** 攻击者具体如何利用此漏洞，包含示例 payload 或 HTTP 请求。

            **修复建议：** 具体的代码修改方案，包含修复后的代码示例：
            ```typescript
            // 修复后的代码
            ```

            > OWASP: [分类] | 置信度: [HIGH/MEDIUM/LOW]

            ## 总结评论

            在所有 inline comment 之后，发一条总结评论，包含：
            - 按严重程度分类的漏洞统计表格
            - 每个漏洞的一行摘要（文件:行号 — 标题）
            - 整体安全评估和优先修复建议

            ## 规则
            - 所有输出使用中文
            - 只报告有把握的问题，避免误报
            - 必须阅读实际代码后再报告，不要猜测
            - 每个发现必须包含具体的修复代码示例
          claude_args: '--model us.anthropic.claude-opus-4-6-v1:0 --max-turns 20'

  # Job 2: Respond to @claude mentions in comments
  claude-respond:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Claude Code Respond
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          trigger_phrase: "@claude"
          claude_args: '--model us.anthropic.claude-opus-4-6-v1:0 --max-turns 20'
