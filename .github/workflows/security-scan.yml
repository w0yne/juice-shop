name: Security Scan (Claude Code)

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'routes/**'
      - 'lib/**'
      - 'models/**'
      - 'data/**'
      - 'server.ts'
      - 'frontend/src/**'
      - 'security-code-scan/**'
      - '.github/workflows/security-scan.yml'
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Scan mode'
        required: true
        default: 'diff'
        type: choice
        options:
          - full
          - diff

permissions:
  contents: read
  pull-requests: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff mode

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run security scan (PR diff mode)
        if: github.event_name == 'pull_request'
        env:
          CLAUDE_CODE_USE_BEDROCK: "1"
          AWS_REGION: us-east-1
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          CLAUDE_MODEL: global.anthropic.claude-opus-4-6-v1
        run: |
          chmod +x security-code-scan/scan.sh
          ./security-code-scan/scan.sh --diff ${{ github.event.pull_request.base.ref }}

      - name: Run security scan (full mode)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.scan_mode == 'full'
        env:
          CLAUDE_CODE_USE_BEDROCK: "1"
          AWS_REGION: us-east-1
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          CLAUDE_MODEL: global.anthropic.claude-opus-4-6-v1
        run: |
          chmod +x security-code-scan/scan.sh
          ./security-code-scan/scan.sh

      - name: Run security scan (diff mode - manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.scan_mode == 'diff'
        env:
          CLAUDE_CODE_USE_BEDROCK: "1"
          AWS_REGION: us-east-1
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          CLAUDE_MODEL: global.anthropic.claude-opus-4-6-v1
        run: |
          chmod +x security-code-scan/scan.sh
          ./security-code-scan/scan.sh --diff main

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: security-code-scan/reports/
          retention-days: 30

      - name: Post inline review comments on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportsDir = 'security-code-scan/reports';

            // Safely find JSON report files
            let jsonFiles = [];
            try {
              jsonFiles = fs.readdirSync(reportsDir)
                .filter(f => f.endsWith('.json') && !f.startsWith('.'))
                .sort()
                .reverse();
            } catch (e) {
              console.log('Reports directory not found or empty');
            }

            if (jsonFiles.length === 0) {
              console.log('No scan reports found — skipping PR comment');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## 🔒 安全扫描\n\n⚠️ 扫描未生成报告，请检查 Actions 日志。'
              });
              return;
            }

            // Parse report — handle non-JSON gracefully
            let report;
            const reportPath = path.join(reportsDir, jsonFiles[0]);
            try {
              report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            } catch (e) {
              console.log(`Failed to parse ${reportPath}: ${e.message}`);
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## 🔒 安全扫描\n\n⚠️ 报告解析失败，请检查 Artifacts 中的原始输出。'
              });
              return;
            }

            const findings = report.findings || [];
            if (findings.length === 0) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## 🔒 安全扫描结果\n\n✅ 未发现安全问题。'
              });
              return;
            }

            // Get PR changed files and commit SHA
            const { data: prFiles } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 300
            });
            const changedFiles = new Set(prFiles.map(f => f.filename));

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const commitSha = pr.head.sha;

            // Build inline review comments
            const comments = [];
            const nonDiffFindings = [];
            const severityEmoji = {
              CRITICAL: '🔴 严重', HIGH: '🟠 高危',
              MEDIUM: '🟡 中危', LOW: '🟢 低危'
            };

            for (const f of findings) {
              const body = [
                `**${severityEmoji[f.severity] || f.severity} | ${f.cwe_id}**`,
                '', `**${f.title}**`, '',
                f.description, '',
                `**攻击方式：** ${f.attack_vector}`, '',
                `**修复建议：** ${f.remediation}`, '',
                `> OWASP: ${f.owasp_category} | 置信度: ${f.confidence}`
              ].join('\n');

              if (changedFiles.has(f.file) && f.line_start) {
                const comment = { path: f.file, body };
                if (f.line_end && f.line_end > f.line_start) {
                  comment.start_line = f.line_start;
                  comment.line = f.line_end;
                } else {
                  comment.line = f.line_start;
                }
                comments.push(comment);
              } else {
                nonDiffFindings.push(f);
              }
            }

            // Build summary
            const total = findings.length;
            const bySev = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0 };
            findings.forEach(f => { bySev[f.severity] = (bySev[f.severity] || 0) + 1; });

            let body = `## 🔒 Claude Code 安全扫描结果\n\n`;
            body += `| 严重程度 | 数量 |\n|----------|------|\n`;
            body += `| 🔴 严重 | ${bySev.CRITICAL} |\n`;
            body += `| 🟠 高危 | ${bySev.HIGH} |\n`;
            body += `| 🟡 中危 | ${bySev.MEDIUM} |\n`;
            body += `| 🟢 低危 | ${bySev.LOW} |\n`;
            body += `| **合计** | **${total}** |\n\n`;

            if (comments.length > 0) {
              body += `📌 已在代码中标注 **${comments.length}** 个发现\n\n`;
            }

            if (nonDiffFindings.length > 0) {
              body += `<details><summary>📋 不在本次 diff 范围内的发现 (${nonDiffFindings.length})</summary>\n\n`;
              for (const f of nonDiffFindings) {
                body += `- **${severityEmoji[f.severity] || f.severity}** \`${f.file}:${f.line_start}\` — ${f.title}\n`;
              }
              body += `\n</details>\n\n`;
            }

            body += `---\n_由 Claude Code 安全审计自动扫描_`;

            const event = bySev.CRITICAL > 0 ? 'REQUEST_CHANGES' : 'COMMENT';

            // Submit review
            if (comments.length > 0) {
              try {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  commit_id: commitSha,
                  body, event,
                  comments: comments.slice(0, 50)
                });
                console.log(`Review submitted: ${comments.length} inline comments`);
                return;
              } catch (err) {
                console.log(`Inline review failed: ${err.message}, falling back to comment`);
              }
            }

            // Fallback: regular comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
