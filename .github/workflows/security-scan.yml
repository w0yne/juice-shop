name: Claude Code Security Review

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # Job 1: Auto security review on every PR
  security-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Claude Code Security Review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          prompt: |
            你是一名资深应用安全工程师，正在对这个 Pull Request 进行安全审计。

            请执行以下操作：

            1. **分析 PR 的所有代码变更**，重点关注安全漏洞
            2. **对每个发现的漏洞，直接在对应代码行上添加 review comment**，内容包括：
               - 严重程度（🔴严重 / 🟠高危 / 🟡中危 / 🟢低危）
               - CWE 编号
               - 漏洞描述（详细说明形成原因和影响）
               - 攻击方式（包含具体的 payload 示例）
               - 修复建议（包含修复后的代码示例）
            3. **最后发一条总结评论**，包含：
               - 按严重程度分类的漏洞统计表格
               - 整体安全评估
               - 优先修复建议

            检查的漏洞类型包括但不限于：
            - SQL 注入、NoSQL 注入
            - 远程代码执行（eval、new Function、child_process）
            - 跨站脚本 XSS（反射型、存储型、DOM 型）
            - 路径遍历
            - 服务端请求伪造 SSRF
            - 不安全的直接对象引用 IDOR
            - 认证/授权绕过
            - 敏感数据泄露（硬编码密钥、密码明文日志）
            - 不安全的 XML 解析 XXE
            - 弱加密算法

            所有输出使用中文。
          claude_args: '--model us.anthropic.claude-opus-4-6 --max-turns 20'

  # Job 2: Respond to @claude mentions in comments
  claude-respond:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Claude Code Respond
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          trigger_phrase: "@claude"
          claude_args: '--model us.anthropic.claude-opus-4-6 --max-turns 20'
